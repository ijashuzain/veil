location ^~ /veil-player/ {
    proxy_pass http://unix:/run/veil-player/service.sock:;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 180s;
    proxy_send_timeout 30s;
    proxy_buffering off;
    client_max_body_size 2k;
    # Session paths are short-lived bearer capabilities; never log them.
    access_log off;
    error_log /var/log/nginx/veil-player-error.log crit;
}
